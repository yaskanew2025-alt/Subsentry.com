name: subsentry
description: Offline subscription and free-trial tracker. No login, no bank access.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
