name: Build SubSentry APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets you upload the .dart files flat (no folders) from a phone.
      - name: Arrange files
        run: |
          mkdir -p lib test
          for f in *.dart; do
            [ -e "$f" ] || continue
            case "$f" in
              navigation_test.dart) mv "$f" test/ ;;
              *) mv "$f" lib/ ;;
            esac
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          flutter create --org com.subsentry --project-name subsentry --platforms=android _scaffold
          cp -r _scaffold/android android
          rm -rf _scaffold

      - name: Patch Android config (internet, ads, notifications, min SDK)
        run: |
          python3 - <<'PY'
          import re, pathlib

          cfg = pathlib.Path('lib/config.dart').read_text()
          found = re.search(r"kAdMobAppId\s*=\s*'([^']+)'", cfg)
          app_id = found.group(1) if found else 'ca-app-pub-3940256099942544~3347511713'

          mp = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          m = mp.read_text()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
          )
          if 'POST_NOTIFICATIONS' not in m:
              m = m.replace('<application', perms + '    <application', 1)
          extra = (
              '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="' + app_id + '"/>\n'
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
              '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
              '            </intent-filter>\n'
              '        </receiver>\n'
          )
          if 'ScheduledNotificationReceiver' not in m:
              m = m.replace('</application>', extra + '    </application>', 1)
          m = re.sub(r'android:label="[^"]*"', 'android:label="SubSentry"', m, count=1)
          mp.write_text(m)

          for name in ('build.gradle.kts', 'build.gradle'):
              p = pathlib.Path('android/app') / name
              if not p.exists():
                  continue
              g = p.read_text()
              kts = name.endswith('.kts')
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kts
                     else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
              g = g.replace('flutter.minSdkVersion', '24')
              if 'compileOptions {' in g:
                  g = g.replace('compileOptions {', 'compileOptions {\n        ' + flag, 1)
              else:
                  g = g.replace('android {', 'android {\n    compileOptions {\n        ' + flag + '\n    }', 1)
              if 'dependencies {' in g:
                  g = g.replace('dependencies {', 'dependencies {\n    ' + dep, 1)
              else:
                  g += '\ndependencies {\n    ' + dep + '\n}\n'
              p.write_text(g)
          PY

      - name: Get packages
        run: flutter pub get

      # Checks every screen and button navigates correctly. A failure shows
      # here but does not stop the APK from building.
      - name: Navigation tests
        continue-on-error: true
        run: flutter test

      # Builds 4 versions of the app, each with more parts switched on, so we can
      # see on your phone exactly which part makes it close:
      #   1-basic    screens only
      #   2-alerts   + trial alerts
      #   3-payments + Google Play payments
      #   4-FULL     + ads  (the real app)
      - name: Build the 4 phone versions
        run: |
          mkdir -p out
          build () {
            flutter build apk --release --target-platform android-arm,android-arm64 \
              --dart-define=ADS=$2 --dart-define=BILLING=$3 --dart-define=ALERTS=$4
            cp build/app/outputs/flutter-apk/app-release.apk "out/$1.apk"
          }
          build SubSentry-1-basic false false false
          build SubSentry-2-alerts false false true
          build SubSentry-3-payments false true true
          build SubSentry-4-FULL true true true

      - name: Publish APKs to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SubSentry build ${{ github.run_number }}
          files: |
            out/*.apk

      # ------------------------------------------------------------------
      # LAUNCH TEST: starts the app on a virtual Android 11 phone and prints
      # exactly why it crashed, if it does. It never blocks the APK above.
      # Open the last step's log and read the text under "LAUNCH TEST RESULT".
      # ------------------------------------------------------------------
      - name: Build the 4 versions for the virtual phone
        continue-on-error: true
        run: |
          mkdir -p out-x64
          build () {
            flutter build apk --release --target-platform android-x64 \
              --dart-define=ADS=$2 --dart-define=BILLING=$3 --dart-define=ALERTS=$4
            cp build/app/outputs/flutter-apk/app-release.apk "out-x64/$1.apk"
          }
          build SubSentry-1-basic false false false
          build SubSentry-2-alerts false false true
          build SubSentry-3-payments false true true
          build SubSentry-4-FULL true true true

      - name: Write launch-test script
        run: |
          cat > smoke.sh <<'SH'
          #!/usr/bin/env bash
          SUMMARY=""
          for APK in out-x64/*.apk; do
            NAME=$(basename "$APK" .apk)
            adb uninstall com.subsentry.subsentry > /dev/null 2>&1
            if ! adb install -r "$APK" > /dev/null 2>&1; then
              SUMMARY="$SUMMARY\n$NAME : could not install on the test phone"
              continue
            fi
            PKG=$(adb shell pm list packages | grep -i subsentry | head -1 | cut -d: -f2 | tr -d '\r')
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1
            sleep 25
            adb logcat -d -v time > "logcat_$NAME.txt"
            adb exec-out screencap -p > "screenshot_$NAME.png"
            if adb shell pidof "$PKG" | grep -q '[0-9]'; then
              SUMMARY="$SUMMARY\n$NAME : RUNNING (no crash)"
            else
              SUMMARY="$SUMMARY\n$NAME : CRASHED"
              echo ""
              echo "----------- why $NAME crashed -----------"
              grep -n -A25 "FATAL EXCEPTION" "logcat_$NAME.txt" | head -60
              grep -n -A12 "Fatal signal" "logcat_$NAME.txt" | head -30
            fi
            adb shell am force-stop "$PKG" > /dev/null 2>&1
          done
          echo ""
          echo "=========== LAUNCH TEST RESULT ==========="
          printf "$SUMMARY\n"
          echo "=========================================="
          exit 0
          SH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on virtual Android 11 phone
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash smoke.sh

      - name: Save launch-test files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: launch-test
          path: |
            logcat_*.txt
            screenshot_*.png
          if-no-files-found: ignore
